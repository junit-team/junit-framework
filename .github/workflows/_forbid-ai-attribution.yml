name: Forbid AI-attributed commits

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: commit-check/commit-check-action@25b7143b3e69a01ec73c74fac3e6e9c9d56dba72 # v2.21.0
        env:
          CCHK_AI_ATTRIBUTION: forbid
        with:
          message-ai-attribution: true
          branch: false
