name: Forbid AI-attributed commits

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: commit-check/commit-check-action@29f40eff76c4e34733a892492983d2bf95de1fd4 # v2.19.0
        env:
          CCHK_AI_ATTRIBUTION: forbid
          CCHK_CONVENTIONAL_COMMITS: false
          # Disable default length rules
          CCHK_SUBJECT_MIN_LENGTH: 0
          CCHK_SUBJECT_MAX_LENGTH: 10000
        with:
          message: true
          branch: false
