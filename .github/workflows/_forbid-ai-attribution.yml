name: Forbid AI-attributed commits

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: commit-check/commit-check-action@dd5f1133e0f9be73a66ed22ff63fc6ab7812e8de # v2.20.1
        env:
          CCHK_AI_ATTRIBUTION: forbid
          CCHK_CONVENTIONAL_COMMITS: false
          # Disable default length rules
          CCHK_SUBJECT_MIN_LENGTH: 0
          CCHK_SUBJECT_MAX_LENGTH: 10000
        with:
          message: true
          branch: false
