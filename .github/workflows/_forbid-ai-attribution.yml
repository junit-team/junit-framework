name: Forbid AI-attributed commits

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: commit-check/commit-check-action@c535fd72e270c2eba22da6ef9860eebda7ec6ebe # v2.23.0
        env:
          CCHK_AI_ATTRIBUTION: forbid
        with:
          message-ai-attribution: true
          branch: false
