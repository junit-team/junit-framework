name: Forbid AI-attributed commits

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: commit-check/commit-check-action@382788bc42fde36f387a6b62210c8a4a29c24f07 # v2.18.3
        env:
          CCHK_AI_ATTRIBUTION: forbid
          CCHK_CONVENTIONAL_COMMITS: false
          CCHK_IGNORE_AUTHORS: renovate[bot]
        with:
          message: true
          branch: false
