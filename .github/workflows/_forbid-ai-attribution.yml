name: Forbid AI-attributed commits

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: commit-check/commit-check-action@b42dca628bf1212c292cfb18a13dcf9bef2ce6e2 # v2.25.0
        env:
          CCHK_AI_ATTRIBUTION: forbid
        with:
          message-ai-attribution: true
          branch: false
