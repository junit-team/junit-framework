name: Forbid AI-attributed commits

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: commit-check/commit-check-action@0264f70feca84c2c7236a4c0d81a002f3eea37d0 # v2.20.0
        env:
          CCHK_AI_ATTRIBUTION: forbid
          CCHK_CONVENTIONAL_COMMITS: false
          # Disable default length rules
          CCHK_SUBJECT_MIN_LENGTH: 0
          CCHK_SUBJECT_MAX_LENGTH: 10000
        with:
          message: true
          branch: false
