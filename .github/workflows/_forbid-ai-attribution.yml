name: Forbid AI-attributed commits

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: Check commits
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: commit-check/commit-check-action@82856b070249ac36d5a0f88c47cacf0c70f82fa8 # v2.24.0
        env:
          CCHK_AI_ATTRIBUTION: forbid
        with:
          message-ai-attribution: true
          branch: false
